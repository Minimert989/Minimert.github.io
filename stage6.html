<body>
  <div id="msg">
    <h1>System Input Offline</h1>
    <p>Manual override required via data injection.</p>
    <p><em>(Try pasting something...)</em></p>
  </div>

  <script>
    document.addEventListener("paste", (e) => {
      const data = (e.clipboardData || window.clipboardData).getData("text");
      if (data.trim().toLowerCase() === "freedom") {
        window.location.href = "stage7.html";
      } else {
        alert("Injection failed.");
      }
    });

    console.log("Hint: Paste 'freedom' to continue");
