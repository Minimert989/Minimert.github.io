<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stage 4</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(#001100, #000000);
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      color: #0f0;
      text-align: center;
    }
    #ghost-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      z-index: 9999;
    }
    #follow-input {
      position: fixed;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>System Idle</h1>
    <p>Click to initiate connection...</p>
  </div>

  <div id="ghost-zone"></div>
  <input id="follow-input" type="text" />

  <script>
    const input = document.getElementById('follow-input');
    document.body.addEventListener('mousemove', (e) => {
      input.style.left = e.clientX + 'px';
      input.style.top = e.clientY + 'px';
    });

    input.addEventListener('input', (e) => {
      if (e.target.value.trim().toLowerCase() === 'release') {
        window.location.href = 'stage5.html';
      }
    });

    document.getElementById('ghost-zone').addEventListener('click', () => {
      input.focus();
    });

    console.log('%cHint: Click (0,0)', 'color: #0f0');
  </script>
</body>
</html>
